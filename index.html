:root{--bg:#F6F7F4;--kartu:#FFFFFF;--tinta:#16212B;--abu:#4A5A66;--garis:#DCE2E0;--hijau:#0B6B65;--hijau2:#E3F2EF;--hijau3:#8FE0D6;--amber:#F2C48B;--amber2:#FCE9D2;--coklat:#6B3A00;--merah:#C0392B;--merah2:#FBE3E0;--biru:#1F4E78;--biru2:#DDEBF7;--gelap:#22303C;--gelap2:#34434F}
*{box-sizing:border-box}
html,body{margin:0;background:#EEF1EF;color:var(--tinta);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
#app.lebar{max-width:1320px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.p{padding:0 20px}
.atas{padding:18px 20px 10px;display:flex;flex-direction:column;gap:12px}
.baris{display:flex;align-items:center;gap:10px}
.antara{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kolom{display:flex;flex-direction:column;gap:8px}
.isi{flex-grow:1;padding:4px 20px 20px;display:flex;flex-direction:column;gap:12px}
.kecil{font-size:13px;color:var(--abu);line-height:1.45}
.mini{font-size:12px;color:var(--abu)}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:800}
.label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--abu)}
.kembali{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--garis);flex-shrink:0;text-decoration:none}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:16px;padding:14px 16px}
.kartu-menu{display:flex;flex-direction:column;gap:12px;text-decoration:none;background:#fff;border:1px solid var(--garis);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(22,33,43,.06)}
.ikon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:#EEF1EF;color:#34434F;display:inline-block}
.chip.hijau{background:var(--hijau2);color:#0B5A55}.chip.amber{background:var(--amber2);color:var(--coklat)}.chip.merah{background:var(--merah2);color:#7A1F16}.chip.biru{background:var(--biru2);color:var(--biru)}
.gelap{background:var(--tinta);color:#fff}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:15px;min-height:52px;font-weight:800;font-size:16px;background:var(--hijau);color:#fff}
.btn.hitam{background:var(--tinta)}.btn.putih{background:#fff;color:var(--tinta);border:1.5px solid #C9D1CF}.btn.merah{background:#fff;color:#8A1C1C;border:1.5px solid #E3C3C3}
.btn.abu,.btn:disabled{background:#D9DEDC;color:#6B7780;cursor:default}
.btn.kcl{padding:10px;min-height:44px;font-size:14px;border-radius:12px}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiga{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bawah{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--garis);padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:5}
.tab{display:grid;gap:4px;background:#E4E9E7;padding:4px;border-radius:14px}
.tab button{border:0;border-radius:10px;padding:10px 6px;min-height:44px;font-weight:700;font-size:14px;background:transparent;color:var(--abu)}
.tab button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 2px rgba(22,33,43,.12)}
.tab.gelap2{background:var(--gelap)}.tab.gelap2 button{color:#C7D0D6}.tab.gelap2 button.on{background:var(--amber);color:var(--tinta)}
.slot{display:flex;justify-content:space-between;align-items:center;width:100%;border-radius:12px;padding:12px 14px;min-height:54px;text-align:left;border:1.5px solid var(--hijau);background:#fff;transition:background .12s}
.slot.on{background:var(--hijau);color:#fff}
.slot:not(:disabled):active,.btn:not(:disabled):active,.kartu-menu:active,.tab button:active{transform:scale(.98)}
.slot,.btn,.kartu-menu{transition:transform .08s,background .12s}.slot.mati{background:#D9DEDC;color:#34434F;border-color:#D9DEDC;cursor:default}
.slot.lewat{background:#EEF1EF;color:#6B7780;border:1.5px dashed #C9D1CF;cursor:default}
.blok{display:flex;gap:10px;align-items:center;background:#F7E3C9;color:var(--coklat);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;font-weight:700}
.inp{font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid #C9D1CF;background:#fff;min-height:50px;width:100%}
.inp:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--hijau3);outline-offset:2px}
.cek{display:flex;gap:12px;align-items:flex-start;background:transparent;border:0;padding:4px 0;text-align:left;font-size:14px;line-height:1.4;min-height:44px}
.kotak{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;border:2px solid #A9B4B1;background:#fff;color:transparent}
.kotak.on{background:var(--hijau);border-color:var(--hijau);color:#fff}
.atr{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}.atr+.atr{border-top:1px solid #EEF1EF}
.atr-ik{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.atr b{display:block;font-size:15px;line-height:1.3}.atr span{font-size:13.5px;line-height:1.45;color:var(--abu)}.atr span strong{color:var(--tinta)}
.notif{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:92vw;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:naik .2s ease-out}
.notif.galat{background:#7A1F16}
.lapis{position:fixed;inset:0;background:rgba(15,23,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.lembar{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:naik .2s ease-out;max-height:90vh;overflow:auto}
.offline{background:var(--amber);color:var(--tinta);text-align:center;font-size:13px;font-weight:700;padding:6px}
.pil{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;flex-shrink:0}
.muat{padding:40px 20px;text-align:center;color:var(--abu)}
#bilah{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent 0,var(--hijau) 30%,var(--amber) 50%,var(--hijau) 70%,transparent 100%);background-size:50% 100%;background-repeat:no-repeat}
#bilah.on{opacity:1;animation:geser 1.1s ease-in-out infinite}
#bilah.selesai{opacity:0}
@keyframes geser{0%{background-position:-50% 0}100%{background-position:150% 0}}
#pil-muat{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:61;background:var(--tinta);color:#fff;font-size:13px;font-weight:700;padding:6px 14px 6px 10px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap;display:flex;align-items:center}
#pil-muat[hidden]{display:none}
.rangka{display:flex;flex-direction:column;gap:12px;padding:20px}
.rangka i{display:block;border-radius:14px;background:linear-gradient(90deg,#E4E9E7 25%,#F1F4F2 50%,#E4E9E7 75%);background-size:200% 100%;animation:kilau 1.2s linear infinite}
@keyframes kilau{0%{background-position:200% 0}100%{background-position:-200% 0}}
.titik{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}.titik i{width:6px;height:6px;border-radius:99px;background:var(--amber);animation:loncat 1s ease-in-out infinite}
.titik.hijau i{background:var(--hijau)}.titik i:nth-child(2){animation-delay:.15s}.titik i:nth-child(3){animation-delay:.3s}
@keyframes loncat{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
/* bola memantul + riak (dibuat ulang dari video referensi; hanya transform & opacity, < 1 KB) */
.pantul{position:relative;display:inline-block;width:4em;height:4.6em;font-size:10px;flex-shrink:0;vertical-align:middle}
.pantul.kecil{font-size:5px;margin-right:8px}
.pantul .bola{position:absolute;left:50%;bottom:.6em;width:1.2em;height:1.2em;margin-left:-.6em;border-radius:99px;background:var(--hijau);transform-origin:50% 100%;animation:pantul .96s infinite}
.pantul .riak{position:absolute;left:50%;bottom:.35em;width:2.8em;height:.7em;margin-left:-1.4em;border-radius:50%;border:.15em solid var(--hijau);opacity:0;animation:riak .96s infinite}
#pil-muat .pantul .bola,#pil-muat .pantul .riak{background:var(--amber);border-color:var(--amber)}#pil-muat .pantul .riak{background:none}
@keyframes pantul{
  0%{transform:translateY(0) scale(1.6,.6);animation-timing-function:cubic-bezier(.15,.6,.35,1)}
  10%{transform:translateY(-.5em) scale(.6,2.3);animation-timing-function:cubic-bezier(.15,.6,.35,1)}
  32%{transform:translateY(-2.4em) scale(.65,2);animation-timing-function:ease-out}
  48%{transform:translateY(-3.3em) scale(1,1);animation-timing-function:ease-in-out}
  58%{transform:translateY(-3.4em) scale(1.3,.7);animation-timing-function:ease-in}
  70%{transform:translateY(-2.8em) scale(.7,1.8);animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  92%{transform:translateY(-.3em) scale(.6,2.3);animation-timing-function:ease-out}
  100%{transform:translateY(0) scale(1.6,.6)}}
@keyframes riak{0%{transform:scale(.35);opacity:.7}45%{transform:scale(1.25);opacity:0}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.pantul .bola{transform:translateY(-1.5em)}}
/* animasi masuk halaman: hanya opacity & transform (ringan, tidak menunda data) */
#app.masuk .atas,#app.masuk .isi>*,#app.masuk .p>*,#app.masuk .bawah{animation:muncul .34s cubic-bezier(.2,.8,.2,1) both}
#app.masuk .isi>*:nth-child(2){animation-delay:.03s}#app.masuk .isi>*:nth-child(3){animation-delay:.06s}#app.masuk .isi>*:nth-child(4){animation-delay:.09s}
#app.masuk .isi>*:nth-child(5){animation-delay:.12s}#app.masuk .isi>*:nth-child(6){animation-delay:.15s}#app.masuk .isi>*:nth-child(n+7){animation-delay:.18s}
#app.masuk .bawah{animation-name:naikBawah}
@keyframes muncul{from{opacity:0;transform:translateY(10px)}}
@keyframes naikBawah{from{transform:translateY(100%)}}
.gambar-cek path{stroke-dasharray:24;stroke-dashoffset:24;animation:goresCek .45s .25s ease-out forwards}
@keyframes goresCek{to{stroke-dashoffset:0}}
.putar{width:28px;height:28px;border:3px solid #C9D1CF;border-top-color:var(--hijau);border-radius:50%;margin:0 auto 10px;animation:putar .8s linear infinite}
.bar{height:8px;border-radius:999px;background:#E4E8E6;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:tumbuh .5s ease-out both}
@keyframes naik{from{transform:translate(-50%,16px);opacity:0}}
.lembar{animation-name:naik2}@keyframes naik2{from{transform:translateY(24px);opacity:0}}
@keyframes putar{to{transform:rotate(360deg)}}
@keyframes tumbuh{from{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes denyut{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dash{display:grid;grid-template-columns:330px minmax(0,1fr) 330px;gap:14px;padding:14px 24px 24px}
@media (max-width:1000px){.dash{grid-template-columns:1fr}}
.kpi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px 24px 0}
@media (max-width:1000px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

async function api(aksi, p = {}, opsi = {}) {

  if (opsi.cepat && BACA[aksi]) {
    const lama = bacaSimpanan(kunci);
    if (lama) {
      if (Date.now() - lama.t > 10000 && !st.segar[kunci]) perbaruiBelakang(aksi, body, kunci, lama);

  if (!opsi.diam) muatMulai(aksi);

    // data yang sama sedang diambil (mis. disiapkan di belakang)? tunggu yang itu saja, jangan kirim dua kali
    let janji = BACA[aksi] && st.terbang[kunci];

    const kirimUlang = () => kirim(aksi, body, opsi).catch(e => (e.jenis === 'JARINGAN' || e.jenis === 'SERVER') && (BACA[aksi] || AMAN_ULANG[aksi]) ? new Promise(r => setTimeout(r, 800)).then(() => kirim(aksi, body, opsi)) : Promise.reject(e));

  const f = ms => ms == null ? '–' : (ms / 1000).toFixed(1) + ' dtk';
  const tot = med(L.map(x => x.t)), srv = med(L.map(x => x.s)), jar = med(L.filter(x => x.s != null).map(x => x.t - x.s));
  tampil(kepala('Cek kecepatan', 'Diukur langsung dari HP ini · ' + L.length + ' permintaan terakhir', '#/') + `<div class="isi">
    <div class="tiga">${[[f(tot), 'Total (median)'], [f(srv), 'Proses server'], [f(jar), 'Sinyal + Google']].map(x => `<div class="kartu" style="padding:10px;text-align:center"><b class="num" style="font-size:18px;display:block">${x[0]}</b><span class="mini">${x[1]}</span></div>`).join('')}</div>
    <div class="kecil"><b>Total</b> = dari tombol ditekan sampai data diterima HP. <b>Proses server</b> = kerja Apps Script membaca Google Sheet. <b>Sinyal + Google</b> = sisanya: perjalanan data lewat jaringan site dan antrean server Google. Bila bagian ini paling besar, penyebabnya jaringan/server Google, bukan aplikasi.</div>

    <div class="kartu" style="padding:4px 14px">${L.map(x => `<div class="antara" style="padding:8px 0;border-bottom:1px solid #EEF1EF;font-size:13px"><span><b>${esc(x.a)}</b><br><span class="mini">${esc(x.w)}${x.c ? ' · dari simpanan server' : ''}</span>${x.e ? `<br><span class="mini" style="color:var(--merah,#C0392B)">Gagal: ${esc(x.e)}</span>` : ''}</span><span class="num" style="text-align:right"><b>${f(x.t)}</b><br><span class="mini">server ${f(x.s)}</span></span></div>`).join('') || '<div class="kecil" style="padding:10px 0">Belum ada catatan. Pakai aplikasi sebentar, lalu buka halaman ini lagi.</div>'}</div></div>`);

  lembar(`<b style="font-size:18px">${judul}</b><span class="kecil">${(data.dialihkan || []).length} booking dialihkan ke kapster lain · ${d.length} dipindah/dibatalkan.${d.length ? ' Kabari pemesannya:' : ''}</span>${d.map(x => `<a class="btn putih kcl" target="_blank" rel="noopener" href="https://wa.me/${x.wa}?text=${encodeURIComponent('Halo ' + x.nama + ', booking ' + x.kode + (x.ke ? ' dipindah ke ' + x.ke + ' WIT karena ' + sebab + '.' : ' terpaksa dibatalkan karena ' + sebab + '. Silakan pesan jadwal lain lewat aplikasi.') + ' Cek di menu Booking Saya. Terima kasih.')}">WA ${esc(x.nama)} · ${x.ke ? 'pindah ' + esc(x.ke) : 'batal'}</a>`).join('')}<button class="btn" data-act="tutup">Tutup</button>`);
}
function layarNilaiUlang() { st.gulir = window.scrollY; gambarNilai(st.nilaiB); } // ketuk bintang = langsung, tanpa server
function gambarKeluar() {
  const K = st.kel, chip = on => `border-radius:999px;padding:10px 14px;min-height:44px;font-weight:700;font-size:14px;${on ? 'background:#0B6B65;color:#fff;border:1.5px solid #0B6B65' : 'background:#fff;border:1.5px solid #C9D1CF'}`;
  lembar(`<div class="antara"><b style="font-size:18px">Keluar sebentar</b><button data-act="tutup" aria-label="Tutup" style="background:#EEF1EF;border:0;border-radius:10px;width:40px;height:40px;font-size:18px">×</button></div>
    <div class="kolom"><span class="mini" style="font-weight:700">Alasan</span><div class="baris" style="flex-wrap:wrap;gap:8px">${['Ibadah', 'Toilet', 'Ambil alat', 'Lainnya'].map(x => `<button data-act="kelAlasan" data-v="${x}" style="${chip(K.alasan === x)}">${x}</button>`).join('')}</div></div>
    <div class="kolom"><span class="mini" style="font-weight:700">Berapa lama</span><div class="tiga">${[5, 10, 15].map(x => `<button data-act="kelMenit" data-v="${x}" style="${chip(K.menit === x)};border-radius:12px">${x} menit</button>`).join('')}</div></div>
    <div class="kartu" style="background:#FCE9D2;border:0;color:#4A2800;font-size:13px">Waktu keluar tercatat dan terlihat SPV. Batas total per hari mengikuti aturan SPV.</div>
    <button class="btn" data-act="keluarYa">Keluar ${K.menit} menit</button>`);
}

/* ================= ROUTER ================= */
async function router(latar) {
  if (!latar) { tutupLembar(); st.animasi = true; const no = st.nav = (st.nav || 0) + 1; setTimeout(() => { if (st.nav === no && st.dirender !== no) memuat(); }, 150); }
  const h = location.hash || '#/', seg = h.replace(/^#\//, '').split('/');
  try {
    if (!st.info && seg[0] !== 'petugas' && seg[0] !== 'kapster' && seg[0] !== 'spv') memuat();
    switch (seg[0]) {
      case '': return await layarMenu();
      case 'aturan': return await layarAturan(seg[1] === 'k' ? 'k' : 'b');
      case 'barber': return seg[1] === 'form' ? await layarFormBarber() : seg[1] === 'jam' ? await layarBarber() : await layarLayanan();
      case 'karaoke': return seg[1] === 'form' ? await layarFormKaraoke() : await layarKaraoke();
      case 'sukses': return await layarSukses(seg[1]);
      case 'saya': return await layarSaya(seg[1]);
      case 'nilai': return await layarNilai(seg[1]);
      case 'saran': await pastikanInfo(); return layarSaran();
      case 'papan': return await layarPapan();
      case 'diagnosa': return layarDiagnosa();
      case 'petugas': return st.petugas ? go(layarPetugasUtama(), true) : await layarLogin();
      case 'kapster': await pastikanInfo(); return seg[1] === 'semua' ? await layarSemua() : await layarKapster();
      case 'spv': await pastikanInfo(); return seg[1] === 'dashboard' ? await layarDashboard() : await layarSpv(seg[1]);
      default: return go('#/');
    }
  } catch (e) { console.error(e); layarGalat(e && e.error ? e : { error: { pesan: String(e && e.message || e) } }); }
}
addEventListener('hashchange', () => router());
document.documentElement.lang = st.lang;
router(); kirimAntrean();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
